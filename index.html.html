<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Purana Qila — 3D Heritage Explorer (Prototype)</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,400&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#e9dfc9;--mut:#b3a88f;--bg:#1d1b17;--glass:rgba(29,27,23,.78);--line:rgba(233,223,201,.22);--sand:#c98a5a;--moss:#8aa07a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Instrument Sans',system-ui,sans-serif;overflow:hidden}
h1,h2,h3{font-family:'Newsreader',Georgia,serif;font-weight:600;margin:0}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.g{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover,button.on{background:rgba(201,138,90,.28)}button:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
#land{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;justify-content:flex-end;padding:6vw;background:linear-gradient(180deg,rgba(29,27,23,.15),rgba(29,27,23,.92) 75%);transition:opacity .8s}
#land h1{font-size:clamp(44px,9vw,120px);line-height:.95;letter-spacing:.01em}
#land p{font-family:'Newsreader',serif;font-style:italic;font-size:clamp(18px,2.4vw,28px);color:var(--mut);margin:.4em 0 1.2em}
#land .b{display:flex;gap:10px;flex-wrap:wrap}#land button{padding:12px 18px;font-size:15px}
#land small{display:block;margin-top:18px;color:var(--mut);max-width:60ch}
#top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5;display:flex;gap:10px;align-items:center;padding:10px 12px}
#top b{font-family:'Newsreader',serif;font-size:18px;margin-right:6px}
#q{flex:1;max-width:280px;background:var(--glass);border:1px solid var(--line);border-radius:6px;padding:7px 10px;color:var(--ink);font:inherit}
#res{position:absolute;top:48px;left:90px;width:260px;z-index:6}#res button{display:block;width:100%;text-align:left;border:0;border-radius:0}
#side{position:fixed;left:12px;top:60px;z-index:4;width:150px;padding:8px;display:flex;flex-direction:column;gap:4px}
#side button{text-align:left;border:0}
#info{position:fixed;right:12px;top:60px;bottom:78px;width:min(340px,calc(100vw - 24px));z-index:4;padding:16px;overflow:auto;display:none}
#info h2{font-size:26px;margin-bottom:2px}#info .p{color:var(--sand);margin-bottom:8px}
#info dl{margin:10px 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}#info dt{color:var(--mut)}#info dd{margin:0}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border:1px solid var(--moss);color:var(--moss);border-radius:20px;margin:2px 4px 2px 0}
.tag.w{border-color:var(--sand);color:var(--sand)}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 20px)}
#tour{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:5;padding:8px 12px;display:none;gap:8px;align-items:center}
#mm{position:fixed;left:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:4;width:130px;height:170px;padding:0}
#north{position:fixed;right:372px;top:64px;z-index:3;font-family:'Newsreader',serif;font-size:18px;text-align:center}
#hud{position:fixed;left:50%;top:56px;transform:translateX(-50%);z-index:3;color:var(--mut);font-size:12px;text-align:center;pointer-events:none;text-shadow:0 1px 3px #000}
#lab{position:fixed;inset:0;pointer-events:none;z-index:2}#lab span{position:absolute;pointer-events:auto;cursor:pointer;width:30px;height:30px;line-height:28px;text-align:center;font-size:16px;border-radius:50%;background:rgba(29,27,23,.82);border:1px solid var(--line);transform:translate(-50%,-50%)}
@media(max-width:820px){#side{display:none}#north{right:12px;top:100px}#info{top:auto;height:42vh;bottom:120px}#mm{display:none}#q{max-width:none}}
@media(prefers-reduced-motion:reduce){#land{transition:none}}
</style></head><body>
<canvas id="c"></canvas><div id="lab"></div>
<div id="land"><h1>Purana Qila</h1><p>The Living Heritage of Delhi</p>
<div class="b"><button id="b1">Explore the fort in 3D</button><button id="b2">Start guided heritage walk</button><button id="b3">Free exploration</button></div>
<small>Prototype. Monument positions are approximate, placed from the Heritage Walk map and aerial photos, and are not survey-verified. Architecture is simplified massing, not an accurate reconstruction.</small></div>
<div id="top" class="g" style="border-radius:0;border-width:0 0 1px"><b>Purana Qila</b><input id="q" placeholder="Search monuments" aria-label="Search monuments"><div id="res" class="g" hidden></div>
<span style="flex:1"></span><button id="lang">EN</button><button id="snd" aria-pressed="false">Sound off</button><button id="acc">A+</button></div>
<div id="side" class="g"><button data-s="explore">Explore</button><button data-s="tour">Heritage walk</button><button data-s="mon">Monuments</button><button data-s="time">Timeline</button><button data-s="near">Nearby</button><button data-s="about">About</button></div>
<div id="info" class="g"></div><div id="north">N<br>↑</div><div id="hud"></div>
<canvas id="mm" class="g" width="130" height="170"></canvas>
<div id="tour" class="g"><button id="tp">◀</button><span id="ts"></span><button id="tn">▶</button><button id="tx">Free explore</button></div>
<div id="bar" class="g"><button id="v2d">2D</button><button id="vg">Ground view</button><button id="vw">Walk (WASD)</button><button id="vn">Night</button><button id="vm">Measure</button><button id="vr">Reset</button><button id="vf">Fullscreen</button></div>
